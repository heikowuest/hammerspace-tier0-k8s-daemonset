apiVersion: v1
kind: ConfigMap
metadata:
  name: knfsd-exporter
  namespace: storage
data:
  start-nfs.sh: |
    #!/usr/bin/env sh
    set -eu

    # Allowed NFS clients = Hammerspace Anvil + DSX IPs (all interfaces except HA-only),
    # written to $ALLOW_FILE by the attach container (refresh-allow-hosts.sh).
    # Until that file exists: HS_ALLOW_FALLBACK if set, otherwise the node's own subnet.
    : "${HS_ALLOW_FALLBACK:=}"
    : "${ALLOW_FILE:=/hsallow/allow-hosts}"
    : "${EXPORT_OPTS:=rw,sync,secure,no_subtree_check,no_root_squash,sec=sys}"
    : "${NFSD_THREADS:=128}"
    : "${MOUNTD_PORT:=20048}"
    : "${READ_AHEAD_KB:=4096}"
    : "${WATCH_SECONDS:=30}"
    : "${MOUNT_WAIT_SECONDS:=60}"

    EXPORT_PATH="/local"

    log() { echo "[knfsd] $(date +%H:%M:%S) $*"; }

    log "node=${NODE_NAME:-unknown} export=${EXPORT_PATH} opts=${EXPORT_OPTS} threads=${NFSD_THREADS}"

    # --- /local must be the NVMe, never the root disk (replaces the 'mp' export option,
    #     which cannot work here because /local is always a bind mount in the container)
    local_source() {
      awk '$5=="/local"{for(i=7;i<=NF;i++) if($i=="-"){print $(i+2); exit}}' /proc/self/mountinfo
    }
    waited=0
    while :; do
      src="$(local_source)"
      case "$src" in
        /dev/nvme*|/dev/md*) break ;;
      esac
      if [ "$waited" -ge "$MOUNT_WAIT_SECONDS" ]; then
        log "ERROR: /local source='$src' is not an NVMe/MD device -> not exporting, restarting container"
        exit 1
      fi
      sleep 5; waited=$((waited + 5))
    done
    log "/local is on $src"

    # --- Tuning (Hammerspace Tier0 BKM, see BeratUlualan/Ansible-Tier0-1 perf_tuning)
    tune() { sysctl -w "$1=$2" >/dev/null 2>&1 && log "sysctl $1=$2" || log "WARN: sysctl $1 failed"; }
    tune net.core.rmem_max 268435456
    tune net.core.wmem_max 268435456
    tune net.ipv4.tcp_rmem "4096 87380 268435456"
    tune net.ipv4.tcp_wmem "4096 65536 268435456"
    tune net.core.netdev_max_backlog 250000
    tune net.ipv4.tcp_mtu_probing 1
    dev="$(basename "$src")"
    if echo "$READ_AHEAD_KB" > "/sys/block/$dev/queue/read_ahead_kb" 2>/dev/null; then
      log "read_ahead_kb $dev=$(cat /sys/block/$dev/queue/read_ahead_kb)"
    else
      log "WARN: could not set read_ahead_kb on $dev"
    fi

    if [ ! -d /proc/fs/nfsd ]; then
      echo "[knfsd] ERROR: /proc/fs/nfsd missing"
      exit 1
    fi

    if [ ! -f /proc/fs/nfsd/threads ]; then
      mount -t nfsd nfsd /proc/fs/nfsd 2>/dev/null || true
    fi

    sysctl -w fs.nfs.nlm_tcpport=32768 >/dev/null 2>&1 || true
    sysctl -w fs.nfs.nlm_udpport=32768 >/dev/null 2>&1 || true

    rpcbind -w
    rpc.statd --no-notify 2>/dev/null || true
    rpc.mountd -F -p "${MOUNTD_PORT}" --manage-gids &

    if [ -f /proc/fs/nfsd/versions ]; then
      echo "+3 -4 -4.1 -4.2" > /proc/fs/nfsd/versions 2>/dev/null || true
    fi

    # el10_2+ kernels do not rpcbind-register listeners written to /proc/fs/nfsd/portlist
    # (Hammerspace volume-add then fails). rpc.nfsd hands over sockets, which do get registered.
    # Stop any nfsd left from a previous container first, so it registers with this rpcbind.
    echo 0 > /proc/fs/nfsd/threads 2>/dev/null || true
    rpc.nfsd -N 4 -N 4.1 -N 4.2 -V 3 -U -p 2049 "${NFSD_THREADS}"

    # --- Self-test: NFS v3 must be registered with rpcbind (Hammerspace checks this)
    nfs_registered() {
      rpcinfo -p 2>/dev/null | awk '$1==100003 && $2==3 && $3=="tcp"{f=1} END{exit !f}'
    }
    if ! nfs_registered; then
      log "ERROR: NFS v3 (100003) is not registered with rpcbind -> restarting container"
      rpcinfo -p || true
      exit 1
    fi
    log "NFS v3 registered with rpcbind"

    # --- Exports: one entry per allowed Hammerspace IP
    # Fallback: the subnet of the interface that carries the node IP, e.g. 10.49.101.0/24
    node_subnet() {
      cidr="$(ip -o -4 addr show 2>/dev/null \
        | awk -v ip="${NODE_IP:-}" '{split($4,a,"/"); if (a[1]==ip) {print $4; exit}}')"
      [ -n "$cidr" ] || return 0
      net="$(ipcalc -n "$cidr" 2>/dev/null | sed -n 's/^NETWORK=//p')"
      if [ -n "$net" ]; then echo "$net/${cidr#*/}"; else echo "$cidr"; fi
    }
    write_exports() {
      hosts=""; from=""
      if [ -s "$ALLOW_FILE" ]; then
        hosts="$(grep -E '^[0-9]+(\.[0-9]+){3}$' "$ALLOW_FILE" | tr '\n' ' ')"
        from="api"
      fi
      if [ -z "$hosts" ] && [ -n "$HS_ALLOW_FALLBACK" ]; then
        hosts="$HS_ALLOW_FALLBACK"; from="HS_ALLOW_FALLBACK"
      fi
      if [ -z "$hosts" ]; then
        hosts="$(node_subnet)"; from="node subnet (fallback)"
      fi
      if [ -z "$hosts" ]; then
        log "ERROR: no allow-list from API, no HS_ALLOW_FALLBACK and no node subnet for NODE_IP=${NODE_IP:-} -> restarting container"
        exit 1
      fi
      line="$EXPORT_PATH"
      for h in $hosts; do line="$line $h($EXPORT_OPTS)"; done
      echo "$line" > /etc/exports
      log "exports from $from: $hosts"
    }
    apply_exports() {
      out="$(exportfs -ra 2>&1)" || { log "ERROR: exportfs failed: $out"; return 1; }
      if [ -n "$out" ]; then log "ERROR: exportfs warned: $out"; return 1; fi
      exportfs -v
    }

    write_exports
    apply_exports || exit 1
    log "ready"

    # --- Watch: re-export when the allow-list changes, restart if NFS drops out of rpcbind
    sum() { cksum "$ALLOW_FILE" 2>/dev/null || echo none; }
    last="$(sum)"
    while :; do
      sleep "$WATCH_SECONDS"
      if ! nfs_registered; then
        log "ERROR: NFS v3 no longer registered with rpcbind -> restarting container"
        exit 1
      fi
      cur="$(sum)"
      if [ "$cur" != "$last" ]; then
        write_exports
        apply_exports || log "WARN: keeping previous export state"
        last="$cur"
      fi
    done
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hammerspace-attach
  namespace: storage
data:
  attach-hammerspace.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    : "${HSMGMT_IP:?set HSMGMT_IP}"
    : "${HS_USER:=admin}"
    : "${HS_PASS:?set HS_PASS}"
    : "${NODE_NAME:?set NODE_NAME}"
    : "${NODE_IP:?set NODE_IP}"
    : "${EXPORT_PATH:=/local}"

    : "${WAIT_SECONDS:=3}"
    : "${WAIT_TRIES:=100}"
    # Hammerspace refreshes the logical volume capacity only every few minutes;
    # a volume with 0 bytes is rejected, so wait up to LV_WAIT_TRIES*LV_WAIT_SECONDS.
    : "${LV_WAIT_SECONDS:=10}"
    : "${LV_WAIT_TRIES:=90}"
    : "${SKIP_PERF_TEST:=true}"
    : "${FORCE:=true}"

    HS_BASE="https://${HSMGMT_IP}:443/mgmt/v1.2/rest"
    HDR=(-H "Content-Type: application/json" -H "Accept: application/json" -H "X-Admin: admin")
    AUTH=(-u "${HS_USER}:${HS_PASS}")
    CURL=(-sS -k "${AUTH[@]}" "${HDR[@]}")

    log() { echo "[${NODE_NAME:-unknown}][attach-hs] $(date +%H:%M:%S) $*" >&2; }

    hs_get() { curl "${CURL[@]}" "${HS_BASE}$1"; }

    hs_post() {
      local path="$1"
      local json="$2"
      local tmp_h tmp_b status location
      tmp_h="$(mktemp)"; tmp_b="$(mktemp)"
      curl "${CURL[@]}" -D "$tmp_h" -o "$tmp_b" --data "$json" "${HS_BASE}${path}" || true
      status="$(head -n1 "$tmp_h" | awk '{print $2}')"
      location="$(awk -F': ' 'tolower($1)=="location"{print $2}' "$tmp_h" | tr -d '\r')"
      echo "${status}|${location}|$(cat "$tmp_b")"
      rm -f "$tmp_h" "$tmp_b"
    }

    wait_task() {
      local task_url="$1"
      local status="unknown"
      local i=0
      while [[ "$status" != "COMPLETED" ]]; do
        ((i++)) || true
        if (( i > WAIT_TRIES )); then
          log "ERROR: task did not complete in time: $task_url"
          return 1
        fi
        sleep "$WAIT_SECONDS"

        local task_json msg
        task_json="$(curl -sS -k "${AUTH[@]}" "$task_url" || true)"
        status="$(echo "$task_json" | jq -r '.status // "unknown"')"
        msg="$(echo "$task_json" | jq -r '.statusMessage // ""')"

        log "task status=$status url=$task_url msg=${msg}"

        if [[ "$status" == "FAILED" ]]; then
          if echo "$msg" | grep -qi 'already exists'; then
            log "task FAILED but 'already exists' -> treating as success"
            return 0
          fi
          return 1
        fi
      done
      return 0
    }

    add_node_if_needed() {
      # curl exits 0 on HTTP errors too, so check the answer really is this node
      if hs_get "/nodes/${NODE_NAME}" 2>/dev/null \
          | jq -e --arg n "$NODE_NAME" 'type=="object" and .name==$n' >/dev/null 2>&1; then
        log "node already exists, continuing"
        return 0
      fi

      local payload
      payload="$(jq -n --arg name "$NODE_NAME" --arg ip "$NODE_IP" \
        '{ _type:"NODE", nodeType:"OTHER", name:$name, mgmtIpAddress:{address:$ip} }')"

      local out status location body
      out="$(hs_post "/nodes" "$payload")"
      status="${out%%|*}"; out="${out#*|}"
      location="${out%%|*}"; body="${out#*|}"

      if [[ "$status" == "202" && -n "$location" ]]; then
        log "add node async: ${NODE_NAME} (${NODE_IP})"
        wait_task "$location"
        return 0
      fi
      if [[ "$status" =~ ^2 ]]; then
        log "add node ok: ${NODE_NAME} (${NODE_IP}) status=$status"
        return 0
      fi
      if echo "$body" | grep -qiE 'already exists|duplicate'; then
        log "node already exists (POST response), continuing"
        return 0
      fi
      log "add node failed status=$status body=${body:0:200}"
      return 1
    }

    wait_for_logical_volume() {
      local i=0
      while (( i < LV_WAIT_TRIES )); do
        ((i++)) || true
        local node lv cap
        node="$(hs_get "/nodes/${NODE_NAME}" || true)"
        lv="$(echo "$node" | jq -c --arg p "$EXPORT_PATH" '
          .platformServices[]?
          | select(._type=="LOGICAL_VOLUME")
          | select(.name==$p)
        ' 2>/dev/null | head -n1 || true)"

        if [[ -n "$lv" ]]; then
          cap="$(echo "$lv" | jq -r '.totalCapacity // 0')"
          if [[ "$cap" =~ ^[0-9]+$ ]] && (( cap > 0 )); then
            log "LOGICAL_VOLUME ${EXPORT_PATH} ready, capacity=${cap}"
            echo "$node" > /tmp/hs_node.json
            echo "$lv"
            return 0
          fi
          (( i == 1 || i % 6 == 0 )) && log "LOGICAL_VOLUME ${EXPORT_PATH} still reports capacity=${cap}, waiting for Hammerspace to refresh it ..."
        else
          (( i == 1 || i % 6 == 0 )) && log "waiting for LOGICAL_VOLUME ${EXPORT_PATH} on ${NODE_NAME} ..."
        fi
        sleep "$LV_WAIT_SECONDS"
      done

      log "ERROR: LOGICAL_VOLUME ${EXPORT_PATH} not usable for ${NODE_NAME} after $((LV_WAIT_TRIES * LV_WAIT_SECONDS))s"
      hs_get "/nodes/${NODE_NAME}" | jq -r '.platformServices[]? | select(._type=="LOGICAL_VOLUME") | .name' || true
      return 1
    }

    add_storage_volume() {
      local node_json="$1"
      local lv_json="$2"
      local volname="${NODE_NAME}::${EXPORT_PATH}"

      local payload
      payload="$(jq -n \
        --arg name "$volname" \
        --argjson node "$node_json" \
        --argjson lv "$lv_json" \
        '{ _type:"STORAGE_VOLUME", name:$name, logicalVolume:$lv, node:$node }')"

      local qs="?force=${FORCE}&skipPerfTest=${SKIP_PERF_TEST}"
      local out status location body
      out="$(hs_post "/storage-volumes${qs}" "$payload")"
      status="${out%%|*}"; out="${out#*|}"
      location="${out%%|*}"; body="${out#*|}"

      if [[ "$status" == "202" && -n "$location" ]]; then
        log "add storage-volume async: $volname"
        wait_task "$location"
        return 0
      fi
      if [[ "$status" =~ ^2 ]]; then
        log "add storage-volume ok: $volname status=$status"
        return 0
      fi
      if echo "$body" | grep -qiE 'already exists|duplicate'; then
        log "storage-volume already exists, continuing"
        return 0
      fi
      log "add storage-volume failed status=$status body=${body:0:200}"
      return 1
    }

    main() {
      log "registering ${NODE_IP}:${EXPORT_PATH} node=${NODE_NAME}"
      add_node_if_needed
      lv_json="$(wait_for_logical_volume)"
      node_json="$(cat /tmp/hs_node.json)"
      add_storage_volume "$node_json" "$lv_json"
      log "DONE"
    }

    main
  reset-hammerspace-volume.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    : "${HSMGMT_IP:?set HSMGMT_IP}"
    : "${HS_USER:=admin}"
    : "${HS_PASS:?set HS_PASS}"
    : "${NODE_NAME:?set NODE_NAME}"
    : "${EXPORT_PATH:=/local}"

    : "${WAIT_SECONDS:=3}"
    : "${WAIT_TRIES:=60}"
    : "${SKIP_PERF_TEST:=true}"
    : "${FORCE:=true}"

    HS_BASE="https://${HSMGMT_IP}:443/mgmt/v1.2/rest"
    HDR=(-H "Content-Type: application/json" -H "Accept: application/json" -H "X-Admin: admin")
    AUTH=(-u "${HS_USER}:${HS_PASS}")
    CURL=(-sS -k "${AUTH[@]}" "${HDR[@]}")

    log() { echo "[${NODE_NAME:-unknown}][reset] $(date +%H:%M:%S) $*" >&2; }

    hs_get() { curl "${CURL[@]}" "${HS_BASE}$1"; }

    hs_req() {
      local method="$1"
      local path="$2"
      local tmp_h tmp_b status location
      tmp_h="$(mktemp)"; tmp_b="$(mktemp)"
      curl "${CURL[@]}" -X "$method" -D "$tmp_h" -o "$tmp_b" "${HS_BASE}${path}" || true
      status="$(head -n1 "$tmp_h" | awk '{print $2}')"
      location="$(awk -F': ' 'tolower($1)=="location"{print $2}' "$tmp_h" | tr -d '\r')"
      echo "${status}|${location}|$(cat "$tmp_b")"
      rm -f "$tmp_h" "$tmp_b"
    }

    wait_task() {
      local task_url="$1"
      local status="unknown"
      local i=0
      while [[ "$status" != "COMPLETED" ]]; do
        ((i++)) || true
        if (( i > WAIT_TRIES )); then
          log "ERROR: task did not complete in time: $task_url"
          return 1
        fi
        sleep "$WAIT_SECONDS"

        local task_json msg
        task_json="$(curl -sS -k "${AUTH[@]}" "$task_url" || true)"
        status="$(echo "$task_json" | jq -r '.status // "unknown"')"
        msg="$(echo "$task_json" | jq -r '.statusMessage // ""')"

        log "task status=$status url=$task_url msg=${msg}"

        if [[ "$status" == "FAILED" ]]; then
          if echo "$msg" | grep -qi 'already exists'; then
            log "task FAILED but 'already exists' -> treating as success"
            return 0
          fi
          return 1
        fi
      done
      return 0
    }

    delete_storage_volume_by_name() {
      local volname="$1"
      local uuid
      uuid="$(hs_get "/storage-volumes" \
        | jq -r --arg n "$volname" '.[] | select(.name==$n) | .uoid.uuid' \
        | head -n1 || true)"

      if [[ -z "$uuid" || "$uuid" == "null" ]]; then
        log "volume not found by name ($volname) -> nothing to delete"
        return 0
      fi

      if [[ "${BYPASS_DECOMMISSION:-false}" == "true" ]]; then
       log "deleting storage-volume uuid=$uuid name=$volname (bypassDecommission=DataLossRiskAcknowledged)"
      else
       log "deleting storage-volume uuid=$uuid name=$volname (normal decommission)"
      fi
      local out status location body
      # Forced remove (Tier0 ephemeral): skip decommission
      if [[ "${BYPASS_DECOMMISSION:-false}" == "true" ]]; then
        out="$(hs_req "DELETE" "/storage-volumes/${uuid}?bypassDecommission=DataLossRiskAcknowledged")"
      else
        out="$(hs_req "DELETE" "/storage-volumes/${uuid}")"
      fi
      status="${out%%|*}"; out="${out#*|}"
      location="${out%%|*}"; body="${out#*|}"

      if [[ "$status" == "202" && -n "$location" ]]; then
        log "delete async -> waiting task"
        wait_task "$location"
        return 0
      fi
      if [[ "$status" =~ ^2 ]]; then
        log "delete ok status=$status"
        return 0
      fi
      if [[ "$status" == "404" ]]; then
        log "delete 404 (already gone)"
        return 0
      fi

      log "WARNING: delete failed status=$status body=${body:0:200}"
      return 1
    }

    add_storage_volume_only() {
      local volname="${NODE_NAME}::${EXPORT_PATH}"

      local node_json
      node_json="$(hs_get "/nodes/${NODE_NAME}")"

      local lv_json
      lv_json="$(echo "$node_json" | jq -c --arg p "$EXPORT_PATH" '
        .platformServices[]?
        | select(._type=="LOGICAL_VOLUME")
        | select(.name==$p)
      ' | head -n1 || true)"

      if [[ -z "$lv_json" ]]; then
        log "ERROR: cannot find LOGICAL_VOLUME ${EXPORT_PATH} on node ${NODE_NAME}"
        echo "$node_json" | jq -r '.platformServices[]? | select(._type=="LOGICAL_VOLUME") | .name' >&2 || true
        return 1
      fi

      local payload
      payload="$(jq -n \
        --arg name "$volname" \
        --argjson node "$node_json" \
        --argjson lv "$lv_json" \
        '{ _type:"STORAGE_VOLUME", name:$name, logicalVolume:$lv, node:$node }')"

      local qs="?force=${FORCE}&skipPerfTest=${SKIP_PERF_TEST}"

      local tmp_h tmp_b status location body
      tmp_h="$(mktemp)"; tmp_b="$(mktemp)"
      curl -sS -k "${AUTH[@]}" "${HDR[@]}" -D "$tmp_h" -o "$tmp_b" --data "$payload" \
        "${HS_BASE}/storage-volumes${qs}" || true
      status="$(head -n1 "$tmp_h" | awk '{print $2}')"
      location="$(awk -F': ' 'tolower($1)=="location"{print $2}' "$tmp_h" | tr -d '\r')"
      body="$(cat "$tmp_b")"
      rm -f "$tmp_h" "$tmp_b"

      if [[ "$status" == "202" && -n "$location" ]]; then
        log "add storage-volume async: $volname"
        wait_task "$location"
        return 0
      fi
      if [[ "$status" =~ ^2 ]]; then
        log "add storage-volume ok: $volname status=$status"
        return 0
      fi
      if echo "$body" | grep -qiE 'already exists|duplicate'; then
        log "storage-volume already exists, continuing"
        return 0
      fi
      log "add storage-volume failed status=$status body=${body:0:200}"
      return 1
    }

    main() {
      local volname="${NODE_NAME}::${EXPORT_PATH}"
      log "RESET start for $volname"
      delete_storage_volume_by_name "$volname" || true
      add_storage_volume_only
      log "RESET done for $volname"
    }

    main
  refresh-allow-hosts.sh: |
    #!/usr/bin/env bash
    # Writes the NFS allow-list for the knfsd container: every IP of the Hammerspace
    # Anvil and DSX nodes, except interfaces whose only role is HA.
    # Only replaces the file when the API answered with a non-empty, valid list.
    set -uo pipefail

    : "${HSMGMT_IP:?set HSMGMT_IP}"
    : "${HS_USER:=admin}"
    : "${HS_PASS:?set HS_PASS}"
    : "${ALLOW_FILE:=/hsallow/allow-hosts}"

    B="https://${HSMGMT_IP}/mgmt/v1.2/rest"
    C=(-sS -k --max-time 20 -u "${HS_USER}:${HS_PASS}" -H "Accept: application/json")
    log() { echo "[${NODE_NAME:-unknown}][allow] $(date +%H:%M:%S) $*" >&2; }

    nodes="$(curl "${C[@]}" "$B/nodes" \
      | jq -c '[.[] | select(.productNodeType=="ANVIL" or .productNodeType=="DSX") | .name]')" \
      || { log "WARN: /nodes query failed, keeping current list"; exit 1; }
    ips="$(curl "${C[@]}" "$B/network-interfaces" \
      | jq -r --argjson n "$nodes" '.[]
          | select(.node.name as $x | $n | index($x))
          | select((.roles // []) != ["HA"])
          | .ipAddresses[]?.address' \
      | grep -E '^[0-9]+(\.[0-9]+){3}$' | sort -u)" \
      || { log "WARN: /network-interfaces query failed, keeping current list"; exit 1; }
    if [ -z "$ips" ]; then
      log "WARN: API returned no Anvil/DSX IPs, keeping current list"
      exit 1
    fi

    tmp="$(mktemp "${ALLOW_FILE}.XXXXXX")"
    echo "$ips" > "$tmp"
    if cmp -s "$tmp" "$ALLOW_FILE"; then
      rm -f "$tmp"
    else
      chmod 0644 "$tmp"
      mv -f "$tmp" "$ALLOW_FILE"
      log "allow-list updated: $(echo $ips)"
    fi
  run-attach-loop.sh: |
    #!/usr/bin/env sh
    set -eu

    log() { echo "[${NODE_NAME:-unknown}][attach] $(date +%H:%M:%S) $*" >&2; }

    # The package mirror is often unreachable right after a node reboot: retry instead of crashing
    until apk add --no-cache bash curl jq ca-certificates util-linux >/dev/null 2>&1; do
      log "apk add failed (mirror not reachable?), retrying in 30s"
      sleep 30
    done

    # Keep the knfsd allow-list in sync with the Hammerspace Anvil/DSX IPs
    (
      set +e
      while :; do
        /scripts/refresh-allow-hosts.sh
        sleep "${ALLOW_REFRESH_SECONDS:-300}"
      done
    ) &

    SENTINEL="${SENTINEL_DIR:-/local/Hammerspace}"
    GRACE_SECONDS="${GRACE_SECONDS:-90}"
    COOLDOWN_SECONDS="${COOLDOWN_SECONDS:-600}"
    # Seconds between sentinel checks while attached, and between attach retries
    CHECK_SECONDS="${CHECK_SECONDS:-300}"
    RETRY_SECONDS="${RETRY_SECONDS:-300}"
    # The reset deletes the Hammerspace volume (with BYPASS_DECOMMISSION=true that wipes
    # the Tier0 data on this node). Off by default; run reset-hammerspace-volume.sh by hand,
    # or set AUTO_RESET=true to get the old behaviour back.
    AUTO_RESET="${AUTO_RESET:-false}"
    LAST_RESET_FILE="/state/last_reset_epoch"

    is_mounted() { findmnt -n --target /local >/dev/null 2>&1; }
    mnt_source() { findmnt -n -o SOURCE --target /local 2>/dev/null || true; }
    root_source() { findmnt -n -o SOURCE --target / 2>/dev/null || true; }

    cooldown_ok() {
      now="$(date +%s)"
      last="$(cat "$LAST_RESET_FILE" 2>/dev/null || echo 0)"
      [ $((now - last)) -ge "$COOLDOWN_SECONDS" ]
    }

    mark_reset() { date +%s > "$LAST_RESET_FILE"; }

    sleep 5

    if ! is_mounted; then
      log "/local is NOT mounted yet -> will not attach/reset"
      tail -f /dev/null
    fi

    src="$(mnt_source)"
    rtsrc="$(root_source)"

    if [ -z "$src" ] || [ -z "$rtsrc" ]; then
      log "cannot determine mount sources (local='$src' root='$rtsrc') -> refusing"
      tail -f /dev/null
    fi

    if [ "$src" = "$rtsrc" ]; then
      log "DANGER: /local appears to be on root filesystem (source=$src). Refusing."
      tail -f /dev/null
    fi

    case "$src" in
      /dev/nvme*|/dev/md*|UUID=*|LABEL=*) : ;;
      *)
        log "WARNING: /local source=$src not in expected patterns; refusing for safety"
        tail -f /dev/null
        ;;
    esac

    log "/local mounted OK (source=$src)"

    wait_for_sentinel() {
      waited=0
      while [ "$waited" -lt "$GRACE_SECONDS" ]; do
        [ -d "$SENTINEL" ] && return 0
        sleep 10; waited=$((waited + 10))
      done
      [ -d "$SENTINEL" ]
    }

    # Runs forever: silent while the sentinel exists (no REST call), otherwise
    # (re)attach every RETRY_SECONDS. Never deletes anything unless AUTO_RESET=true.
    state=""
    while :; do
      if [ -d "$SENTINEL" ]; then
        [ "$state" = ok ] || log "sentinel exists ($SENTINEL) -> ok"
        state=ok
        sleep "$CHECK_SECONDS"
        continue
      fi

      [ "$state" = ok ] && log "sentinel disappeared"
      state=missing
      log "sentinel missing -> ensure attach"
      if /scripts/attach-hammerspace.sh; then
        if wait_for_sentinel; then
          log "sentinel appeared -> ok"
          continue
        fi
        log "volume added but sentinel still missing after ${GRACE_SECONDS}s"
      else
        log "ensure failed"
      fi

      if [ "$AUTO_RESET" = true ] && cooldown_ok; then
        log "AUTO_RESET=true -> resetting volume (cooldown ok)"
        mark_reset
        /scripts/reset-hammerspace-volume.sh || true
      else
        log "not resetting (AUTO_RESET=$AUTO_RESET), retrying in ${RETRY_SECONDS}s"
      fi
      sleep "$RETRY_SECONDS"
    done
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: knfsd-nfs3-hammerspace
  namespace: storage
spec:
  selector:
    matchLabels:
      app: knfsd-nfs3-hammerspace
  template:
    metadata:
      labels:
        app: knfsd-nfs3-hammerspace
    spec:
      # included: your patch
      securityContext:
        seLinuxOptions:
          type: spc_t

      nodeSelector:
        hammerspace-tier0: "enabled"

      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"

      containers:
        - name: knfsd
          image: itsthenetwork/nfs-server-alpine:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # Until the attach container has written /hsallow/allow-hosts from the
            # Hammerspace API, the node's own subnet is exported. To use a fixed list
            # instead, set e.g.:
            # - name: HS_ALLOW_FALLBACK
            #   value: "10.49.101.51 10.49.101.52 10.49.101.54 10.49.101.55"
            - name: EXPORT_OPTS
              value: "rw,sync,secure,no_subtree_check,no_root_squash,sec=sys"
            - name: NFSD_THREADS
              value: "128"
            - name: MOUNTD_PORT
              value: "20048"
            - name: READ_AHEAD_KB
              value: "4096"
          command: ["/bin/sh", "/config/start-nfs.sh"]
          volumeMounts:
            - name: host-local
              mountPath: /local
            - name: nfs-config
              mountPath: /config
            - name: hs-allow
              mountPath: /hsallow
              readOnly: true
          ports:
            - name: nfs
              containerPort: 2049
              protocol: TCP
            - name: rpcbind-tcp
              containerPort: 111
              protocol: TCP
            - name: rpcbind-udp
              containerPort: 111
              protocol: UDP
            - name: mountd-tcp
              containerPort: 20048
              protocol: TCP
            - name: mountd-udp
              containerPort: 20048
              protocol: UDP

        - name: attach
          image: alpine:3.20
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: HSMGMT_IP
              value: "10.49.101.50"
            - name: HS_USER
              value: "admin"
            - name: HS_PASS
              valueFrom:
                secretKeyRef:
                  name: hammerspace-creds
                  key: password
            - name: EXPORT_PATH
              value: "/local"
            - name: GRACE_SECONDS
              value: "90"
            - name: COOLDOWN_SECONDS
              value: "600"
            - name: BYPASS_DECOMMISSION
              value: "true"
            - name: ALLOW_REFRESH_SECONDS
              value: "300"

          command: ["/bin/sh", "/scripts/run-attach-loop.sh"]
          volumeMounts:
            - name: attach-scripts
              mountPath: /scripts
            - name: host-local
              mountPath: /local
              readOnly: true
            - name: tier0-state
              mountPath: /state
            - name: hs-allow
              mountPath: /hsallow

      volumes:
        - name: host-local
          hostPath:
            path: /local
            type: DirectoryOrCreate
        - name: nfs-config
          configMap:
            name: knfsd-exporter
            defaultMode: 0755
        - name: attach-scripts
          configMap:
            name: hammerspace-attach
            defaultMode: 0755
        - name: tier0-state
          emptyDir: {}
        # Last known Hammerspace allow-list, kept on the node across pod restarts/reboots
        - name: hs-allow
          hostPath:
            path: /var/lib/hammerspace-tier0
            type: DirectoryOrCreate

